
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DevTrack - Edit Application</title>

  <link href="./output.css" rel="stylesheet">

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

</head>

<body class="font-sans bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
      
      <div class="flex items-center gap-8">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-8 h-8 bg-emerald-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">D</div>
          <span class="font-bold text-xl text-slate-900">DevTrack</span>
        </a>
        <!-- Desktop navigation -->
        <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
            <a href="index.html"
              class="text-slate-600 hover:text-emerald-600 transition-colors py-1">
                Home
            </a>

            <a href="jobs.html"
              class="text-slate-600 hover:text-emerald-600 transition-colors py-1">
                Find Jobs
            </a>

            <a href="dashboard.html"
              class="text-slate-600 hover:text-emerald-600 transition-colors py-1">
                Dashboard
            </a>

            <a href="tracker.html"
              class="text-slate-600 hover:text-emerald-600 transition-colors py-1">
                My Tracker
            </a>
        </nav>

        <!-- Mobile navigation -->
        <details class="relative md:hidden">
            <summary class="cursor-pointer list-none rounded-lg border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-700">
                ☰
            </summary>

            <nav class="absolute right-0 top-full mt-2 w-48 rounded-2xl border border-slate-200 bg-white p-3 shadow-lg z-50 flex flex-col gap-3 text-sm">
                <a href="index.html" class="text-slate-600 hover:text-emerald-600">
                    Home
                </a>
                <a href="jobs.html" class="text-slate-600 hover:text-emerald-600">
                    Find Jobs
                </a>
                <a href="dashboard.html" class="text-slate-600 hover:text-emerald-600">
                    Dashboard
                </a>
                <a href="tracker.html" class="text-slate-600 hover:text-emerald-600">
                    My Tracker
                </a>
            </nav>
        </details>
      </div>

      <div class="flex items-center gap-4">
        <a href="saved-jobs.html" class="text-slate-500 hover:text-slate-700 p-2 rounded-full hover:bg-slate-100 transition-colors relative">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
          <span class="absolute top-1 right-1 w-2 h-2 bg-emerald-500 rounded-full"></span>
        </a>
        <a href="index.html" class="text-xs font-semibold text-slate-600 hover:text-emerald-600 transition-colors">Sign Out</a>
        <a href="profile.html" class="flex items-center gap-2 p-1.5 rounded-full hover:bg-slate-100 transition-colors">
          <div class="w-8 h-8 rounded-full bg-slate-900 text-white flex items-center justify-center font-semibold text-xs">AM</div>
        </a>
      </div>

    </div>
  </header>

  <!-- Main content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- Back link -->
    <a href="tracker.html"
       class="text-xs text-slate-500 hover:text-slate-800 mb-4 inline-block">
      &larr; Back to applications
    </a>

    <!-- Page title -->
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-6">
      <h1 class="text-2xl font-bold text-slate-900">
        Edit Application
      </h1>

      <button
        type="submit"
        form="app-form"
        class="bg-emerald-700 hover:bg-emerald-800 text-white px-5 py-2 rounded-lg text-sm font-medium transition-colors"
      >
        Save Changes
      </button>
    </div>

    <!-- Form and status timeline -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Application form -->
      <div class="lg:col-span-2 bg-white p-4 sm:p-6 rounded-2xl border border-slate-200 shadow-sm">

        <form id="app-form" action="tracker.html" class="space-y-4">

          <!-- Job title -->
          <div>
            <label for="job-title" class="block text-xs font-bold text-slate-700 mb-1">
              Job Title
            </label>

            <input
              id="job-title"
              name="jobTitle"
              type="text"
              value="Frontend Developer"
              class="w-full p-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500"
            >
          </div>

          <!-- Company name -->
          <div>
            <label for="company-name" class="block text-xs font-bold text-slate-700 mb-1">
              Company Name
            </label>

            <input
              id="company-name"
              name="companyName"
              type="text"
              value="Linear"
              class="w-full p-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500"
            >
          </div>

          <!-- Job URL -->
          <div>
            <label for="job-url" class="block text-xs font-bold text-slate-700 mb-1">
              Job URL
            </label>

            <input
              id="job-url"
              name="jobUrl"
              type="url"
              value="https://linear.app/careers/frontend"
              class="w-full p-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500"
            >
          </div>

          <!-- Salary and applied date -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

            <div>
              <label for="salary" class="block text-xs font-bold text-slate-700 mb-1">
                Salary
              </label>

              <input
                id="salary"
                name="salary"
                type="text"
                value="$120,000 - $150,000"
                class="w-full p-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500"
              >
            </div>

            <div>
              <label for="applied-date" class="block text-xs font-bold text-slate-700 mb-1">
                Applied Date
              </label>

              <input
                id="applied-date"
                name="appliedDate"
                type="date"
                value="May 20, 2025"
                class="w-full p-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500"
              >
            </div>

          </div>

          <!-- Application status -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-2">
              Status
            </label>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">

              <label class="status-card flex items-center gap-2 p-2.5 border border-slate-200 rounded-lg cursor-pointer transition-all">
                <input
                  type="radio"
                  name="status"
                  value="saved"
                  class="accent-emerald-600"
                >
                <span>Saved</span>
              </label>

              <label class="status-card flex items-center gap-2 p-2.5 border border-slate-200 rounded-lg cursor-pointer transition-all">
                <input
                  type="radio"
                  name="status"
                  value="applied"
                  class="accent-emerald-600"
                >
                <span>Applied</span>
              </label>

              <label class="status-card flex items-center gap-2 p-2.5 border border-slate-200 rounded-lg cursor-pointer transition-all">
                <input
                  type="radio"
                  name="status"
                  value="interview"
                  checked
                  class="accent-emerald-600"
                >
                <span>Interview</span>
              </label>

              <label class="status-card flex items-center gap-2 p-2.5 border border-slate-200 rounded-lg cursor-pointer transition-all">
                <input
                  type="radio"
                  name="status"
                  value="offer"
                  class="accent-emerald-600"
                >
                <span>Offer</span>
              </label>

            </div>
          </div>

          <!-- Notes -->
          <div>
            <label for="notes" class="block text-xs font-bold text-slate-700 mb-1">
              Notes
            </label>

            <textarea
              id="notes"
              name="notes"
              rows="4"
              class="w-full p-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500"
            >Great conversation with the hiring manager. Technical interview scheduled for Thursday at 2 PM.</textarea>
          </div>

        </form>
      </div>

      <!-- Application status timeline -->
      <div class="bg-white p-4 sm:p-6 rounded-2xl border border-slate-200 shadow-sm h-fit">

        <div class="w-8 h-8 bg-emerald-100 text-emerald-600 rounded-lg flex items-center justify-center mb-4">
          ↗
        </div>

        <h3 class="text-sm font-bold text-slate-800 mb-1">
          Application status
        </h3>

        <span class="inline-block bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-1 rounded-full mb-6">
          Interview
        </span>

        <div class="space-y-4 text-xs">

          <div class="flex justify-between items-center text-slate-600 gap-2">
            <span class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-600"></span>
              Saved
            </span>

            <span class="text-slate-400">May 16</span>
          </div>

          <div class="flex justify-between items-center text-slate-600 gap-2">
            <span class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-600"></span>
              Applied
            </span>

            <span class="text-slate-400">May 20</span>
          </div>

          <div class="flex justify-between items-center text-slate-800 font-semibold gap-2">
            <span class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full border-2 border-emerald-600 bg-white"></span>
              Interview
            </span>

            <span class="text-slate-400 font-normal">May 26</span>
          </div>

          <div class="flex justify-between items-center text-slate-400 gap-2">
            <span class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full border border-slate-300 bg-white"></span>
              Offer
            </span>

            <span>-</span>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
    <p>&copy; 2026 DevTrack. All rights reserved.</p>
  </footer>

</body>
</html>
