<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTrack - Create Account</title>
  <link rel="stylesheet" href="./output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body class="font-sans bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <header class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2">
      <div class="w-8 h-8 bg-emerald-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">D</div>
      <span class="font-bold text-xl text-slate-900">DevTrack</span>
    </a>
    <a href="index.html" class="text-xs text-slate-500 hover:text-emerald-600 font-medium">&larr; Back to Home</a>
  </header>

  <main class="w-full max-w-md mx-auto px-4 py-8">
    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
      <div class="text-center space-y-2">
        <h1 class="text-2xl font-bold text-slate-900">Create Your Account</h1>
        <p class="text-sm text-slate-500">Start tracking your developer job search today</p>
      </div>
      <form action="dashboard.html" method="GET" class="space-y-4">
        <div>
          <label for="name" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Full Name</label>
          <input type="text" id="name" required placeholder="Farida Ahmed" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white">
        </div>
        <div>
          <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Email Address</label>
          <input type="email" id="email" required placeholder="farida@example.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white">
        </div>
        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Password</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl transition-colors shadow-sm text-center block mt-2">Create Account</button>
      </form>
      <p class="text-xs text-center text-slate-500 pt-2">
        Already have an account? <a href="login.html" class="text-emerald-600 font-semibold hover:underline">Sign in</a>
      </p>
    </div>
  </main>

  <footer class="py-6 text-center text-xs text-slate-400">
    <p>&copy; 2026 DevTrack. All rights reserved.</p>
  </footer>

</body>
</html>
